; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
src_filter = +<Testbasic.cpp> -<Ultrasonic + Color + Gripper.cpp>
platform_packages =
	toolchain-atmelavr@3.70300.220127
lib_deps =
    z3t0/IRremote@^4.4.1
    martinsos/HCSR04@^2.0.0

; Standalone claw-servo test, isolated from motors/IR/sensors. Flash with:
;   pio run -e servo_test -t upload
[env:servo_test]
platform = atmelavr
board = uno
framework = arduino
src_filter = +<../test/ServoIsolationTest.cpp>
platform_packages =
	toolchain-atmelavr@3.70300.220127
