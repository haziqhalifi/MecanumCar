[env:uno]
platform = atmelavr
board = uno
framework = arduino
platform_packages =
	toolchain-atmelavr@3.70300.220127
lib_deps =
    https://github.com/Arduino-IRremote/Arduino-IRremote.git#2.8.0
    martinsos/HCSR04@^2.0.0
