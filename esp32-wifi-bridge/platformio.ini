; ESP32 WiFi bridge for the mecanum car. Flash onto the ESP32, not the Uno.
;
; Two builds:
;   [env:esp32dev]   — local web-server + WebSocket control dashboard (default).
;                      Serves a control page on the ESP32's LAN IP; browser talks
;                      to it over a WebSocket, ESP32 bridges to the Uno on Serial2.
;   [env:favoriot]   — legacy Favoriot cloud relay (main_favoriot.cpp).
;
; Build/upload the web dashboard build:  pio run -e esp32dev -t upload
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<*> -<main_favoriot.cpp>
lib_deps =
    esp32async/ESPAsyncWebServer@^3.6.0
    esp32async/AsyncTCP@^3.3.2

; Legacy Favoriot cloud relay. Build with:  pio run -e favoriot -t upload
[env:favoriot]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<main_favoriot.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
