; ESP32 WiFi bridge — relays mecanum car telemetry (from the Uno, over
; Serial2) to Favoriot. Flash this onto the separate ESP32 board, not the Uno.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
